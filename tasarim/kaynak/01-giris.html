<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Web giriş</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Geist', system-ui, sans-serif; font-size: 14px">
  <header style="height: 72px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px">
      <div style="width: 30px; height: 30px; border-radius: 9px; background: {{t.accent}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5.5h10M5 10h6M5 14.5h10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path></svg></div>
      Margin
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="font-size: 13px; color: {{t.muted}}">Hesabınız yok mu?</span>
      <a href="{{L.kayitOl}}" style="height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.ink}}; font-weight: 500; display: flex; align-items: center; text-decoration: none">Kayıt ol</a>
      <button type="button" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="width: 36px; height: 36px; border-radius: 9px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.ink2}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
        <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></sc-if>
      </button>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px 48px">
    <div style="width: 100%; max-width: 420px; box-sizing: border-box; background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: 18px; box-shadow: {{t.shadow}}; padding: 36px 32px; display: flex; flex-direction: column; gap: 24px">
      <div>
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.03em">Tekrar hoş geldiniz</h1>
        <p style="margin: 8px 0 0; color: {{t.ink2}}; line-height: 1.5">Öğretmen hesabınızla giriş yapın.</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; gap: 2px; border-radius: 11px; background: {{t.sunken}}; border: 1px solid {{t.line}}">
        <button type="button" style="height: 38px; border: 0; border-radius: 8px; background: {{t.surface}}; box-shadow: 0 0 0 1px {{t.line}}, 0 1px 2px rgba(0,0,0,0.06); font: 500 13px 'Geist', sans-serif; color: {{t.ink}}">Öğretmen</button>
        <button type="button" disabled="disabled" style="height: 38px; border: 0; border-radius: 8px; background: transparent; font: 500 13px 'Geist', sans-serif; color: {{t.muted}}">Veli · yakında</button>
        <button type="button" disabled="disabled" style="height: 38px; border: 0; border-radius: 8px; background: transparent; font: 500 13px 'Geist', sans-serif; color: {{t.muted}}">Öğrenci · yakında</button>
      </div>
      <form style="margin: 0; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="g-eposta" style="font-size: 13px; font-weight: 500">E-posta</label>
          <input id="g-eposta" type="email" placeholder="ad.soyad@okul.edu.tr" style="height: 44px; box-sizing: border-box; border: 1px solid {{t.line2}}; border-radius: 10px; background: {{t.field}}; color: {{t.ink}}; padding: 0 14px; font: 400 14px 'Geist', sans-serif">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <label for="g-sifre" style="font-size: 13px; font-weight: 500">Şifre</label>
            <a href="#" style="font-size: 13px; color: {{t.accentText}}; text-decoration: none; font-weight: 500">Şifremi unuttum</a>
          </div>
          <input id="g-sifre" type="password" placeholder="••••••••" style="height: 44px; box-sizing: border-box; border: 1px solid {{t.line2}}; border-radius: 10px; background: {{t.field}}; color: {{t.ink}}; padding: 0 14px; font: 400 14px 'Geist', sans-serif">
        </div>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: {{t.ink2}}"><input type="checkbox" style="width: 16px; height: 16px; margin: 0; accent-color: {{t.accent}}">Beni hatırla</label>
        <a href="{{L.ogrenciler}}" style="height: 46px; margin-top: 4px; border-radius: 10px; background: {{t.accent}}; color: #FFFFFF; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-shadow: 0 6px 18px rgba(79,70,229,0.28)">
          Giriş yap
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </a>
      </form>
      <p style="margin: 0; padding-top: 18px; border-top: 1px solid {{t.line}}; text-align: center; font-size: 13px; color: {{t.muted}}">Hesabınız yok mu? <a href="{{L.kayitOl}}" style="color: {{t.accentText}}; font-weight: 500; text-decoration: none">Kayıt olun</a></p>
    </div>
  </main>

  <footer style="height: 56px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; font: 400 12px 'Geist Mono', monospace; color: {{t.muted}}">
    <span>© 2026 Margin</span>
    <span>Yardım · Gizlilik</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: null };
  }
  renderVals() {
    var self = this;
    var T = {
      light: { bg: '#F4F4F1', surface: '#FFFFFF', field: '#FFFFFF', sunken: '#F1F1ED', line: '#E4E3DE', line2: '#D3D1CA', ink: '#17171A', ink2: '#45454D', muted: '#6B6B73', accent: '#4F46E5', accentText: '#3730C4', shadow: '0 1px 2px rgba(23,23,26,0.04), 0 16px 40px rgba(23,23,26,0.06)' },
      dark: { bg: '#0B0B0E', surface: '#141418', field: '#0F0F12', sunken: '#0F0F12', line: '#26262D', line2: '#38383F', ink: '#EDEDF1', ink2: '#BDBDC6', muted: '#8E8E99', accent: '#5B53EE', accentText: '#B3AEFF', shadow: '0 1px 2px rgba(0,0,0,0.5), 0 16px 40px rgba(0,0,0,0.35)' }
    };
    var dark = (this.state.theme || this.props.theme || 'light') === 'dark';
    var t = dark ? T.dark : T.light;
    var sfx = dark ? 'Koyu' : '';
    return {
      t: t, isDark: dark, isLight: !dark,
      L: { ogrenciler: 'WebOgrenciler' + sfx + '.dc.html', kayitOl: 'WebKayitOl' + sfx + '.dc.html' },
      themeLabel: dark ? 'Açık temaya geç' : 'Koyu temaya geç',
      toggleTheme: function () { self.setState({ theme: dark ? 'light' : 'dark' }); }
    };
  }
}
</script>
</body>
</html>
